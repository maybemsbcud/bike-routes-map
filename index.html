<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта веломаршрутів</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Карта веломаршрутів</h1>
        <nav>
            <a href="#map">Карта</a>
            <a href="#routes">Маршрути</a>
        </nav>
    </header>

    <main>
        <section id="map">
            <h2>Карта</h2>
            <img src="assets/img/map-placeholder.jpg" alt="Карта веломаршрутів міста">
        </section>

        <section id="routes">
            <h2>Маршрути</h2>
            <div class="cards">
                <article class="card">
                    <h3>ВДНГ - Голосієво</h3>
                    <p>Довжина: 10 км</p>
                    <p>Складність: <span class="badge badge--easy">Легка</span></p>
                </article>
                <article class="card">
                    <h3>Пуща-Водиця</h3>
                    <p>Довжина: 25 км</p>
                    <p>Складність: <span class="badge badge--medium">Середня</span></p>
                </article>
            </div>
        </section>
    </main>

    <aside>
        <h2>Деталі обраного маршруту</h2>
        <p>Тут відображатиметься інформація про маршрут після його вибору.</p>
    </aside>

    <footer>
        <p>&copy; 2026 Левченко Данило, група ІП-56</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
